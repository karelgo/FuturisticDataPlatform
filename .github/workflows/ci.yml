name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e .[dev]
      - name: Unit tests
        run: pytest -q
      - name: Contract gate — compiled artifacts must not drift
        run: carina compile --check

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build container image
        run: docker build -t carina:ci .
      - name: Smoke test — portal answers on /api/lanes
        run: |
          docker run -d --name carina -p 8899:8899 carina:ci
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8899/api/lanes && exit 0 || sleep 1
          done
          docker logs carina
          exit 1
