# External Secrets Operator — the path off dev-static secrets in Git
# (implementation-plan §3.1: ESO + OpenBao, no secrets in Git).
# Chart 2.7.0 (pinned). SecretStore/ExternalSecret examples: see
# platform/planes/security-baseline/README.md — they need a reachable
# OpenBao/Vault, so they ship as documentation, not manifests.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: 2.7.0
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true]
