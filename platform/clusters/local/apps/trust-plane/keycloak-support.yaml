# Keycloak's realm-as-code ConfigMap + its Tier-0 CNPG database.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keycloak-support
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/karelgo/FuturisticDataPlatform
    targetRevision: HEAD
    path: platform/planes/trust-plane/keycloak
  destination:
    server: https://kubernetes.default.svc
    namespace: trust-plane
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true]
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keycloak-db
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/karelgo/FuturisticDataPlatform
    targetRevision: HEAD
    path: platform/planes/trust-plane/keycloak-db
  destination:
    server: https://kubernetes.default.svc
    namespace: trust-plane
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true]
