# The Lakekeeper metadata database — the platform's Tier-0 crown jewels
# (governance-and-sovereignty §8). Manifests in platform/planes/data-plane/lakekeeper-db.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lakekeeper-db
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/karelgo/FuturisticDataPlatform
    targetRevision: HEAD
    path: platform/planes/data-plane/lakekeeper-db
  destination:
    server: https://kubernetes.default.svc
    namespace: data-plane
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
