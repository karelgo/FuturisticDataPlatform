# CloudNativePG operator — runs every control-plane Postgres in the platform.
# Chart 0.29.0 = operator 1.30.0 (pinned; nothing floats on latest).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cnpg-operator
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://cloudnative-pg.io/charts
    chart: cloudnative-pg
    targetRevision: 0.29.0
  destination:
    server: https://kubernetes.default.svc
    namespace: cnpg-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
