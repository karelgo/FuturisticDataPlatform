# Garage — S3-compatible object storage for the dev/laptop profile
# (ADR-0003: Rook-Ceph in prod, Garage on dev/edge).
# Manifests in platform/planes/data-plane/garage (single node, dev only).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: garage
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/karelgo/FuturisticDataPlatform
    targetRevision: HEAD
    path: platform/planes/data-plane/garage
  destination:
    server: https://kubernetes.default.svc
    namespace: data-plane
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
