# Build the carina image ON the cluster from this Git repo — no external
# registry or docker daemon needed (ideal for the Developer Sandbox, where
# you have a namespace but no cluster-admin). The BuildConfig clones the
# repo and runs the Dockerfile with buildah; the result lands in the
# namespace-local ImageStream.
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: carina
  labels:
    app.kubernetes.io/name: carina
spec:
  # Lets plain Deployments reference "carina:0.6.0" and have OpenShift
  # resolve it to this ImageStream — keeps deploy.yaml namespace-agnostic.
  lookupPolicy:
    local: true
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: carina
  labels:
    app.kubernetes.io/name: carina
spec:
  source:
    type: Git
    git:
      uri: https://github.com/karelgo/FuturisticDataPlatform
      ref: claude/futuristic-data-platform-phase-1-vn1ij2   # update on merge
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Dockerfile
  output:
    to:
      kind: ImageStreamTag
      name: carina:0.6.0
  triggers:
    - type: ConfigChange
