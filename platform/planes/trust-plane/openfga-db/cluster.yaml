# OpenFGA's database — control-plane Postgres, CNPG-managed like the rest.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: openfga-db
  namespace: trust-plane
spec:
  instances: 2
  imageName: ghcr.io/cloudnative-pg/postgresql:17.5
  primaryUpdateStrategy: unsupervised
  bootstrap:
    initdb:
      database: openfga
      owner: openfga
  storage:
    size: 2Gi
  backup:
    retentionPolicy: "30d"
    barmanObjectStore:
      destinationPath: s3://carina-backups/openfga-db
      endpointURL: http://garage-s3.data-plane.svc.cluster.local:3900
      s3Credentials:
        accessKeyId:
          name: garage-credentials
          key: access-key
        secretAccessKey:
          name: garage-credentials
          key: secret-key
      wal:
        compression: gzip
