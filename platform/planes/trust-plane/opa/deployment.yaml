# OPA serving the GENERATED contract policies (policies/ at the repo root,
# shipped here as the opa-policies ConfigMap by Argo CD + kustomize).
# Decision logs go to stdout as JSON — the OTel collector picks them up and
# they land in the evidence plane (ADR-0010): every allow/deny is auditable.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opa
  namespace: trust-plane
  labels:
    app.kubernetes.io/name: opa
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: opa
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opa
    spec:
      containers:
        - name: opa
          image: openpolicyagent/opa:1.18.2   # pinned
          args:
            - run
            - --server
            - --addr=:8181
            - --log-format=json
            - --set=decision_logs.console=true
            - /policies
          ports:
            - {name: http, containerPort: 8181}
          readinessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 3
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 30
          volumeMounts:
            - name: policies
              mountPath: /policies
              readOnly: true
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
      volumes:
        - name: policies
          configMap:
            name: opa-policies
---
apiVersion: v1
kind: Service
metadata:
  name: opa
  namespace: trust-plane
spec:
  selector:
    app.kubernetes.io/name: opa
  ports:
    - {name: http, port: 8181}
