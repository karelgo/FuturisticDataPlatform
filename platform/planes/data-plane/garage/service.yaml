apiVersion: v1
kind: Service
metadata:
  name: garage
  namespace: data-plane
spec:
  clusterIP: None                    # headless, for the StatefulSet identity
  selector:
    app.kubernetes.io/name: garage
  ports:
    - {name: s3, port: 3900}
    - {name: rpc, port: 3901}
    - {name: admin, port: 3903}
---
apiVersion: v1
kind: Service
metadata:
  name: garage-s3
  namespace: data-plane
spec:
  selector:
    app.kubernetes.io/name: garage
  ports:
    - {name: s3, port: 3900}
