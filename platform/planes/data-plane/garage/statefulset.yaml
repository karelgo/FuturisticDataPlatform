apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: garage
  namespace: data-plane
spec:
  serviceName: garage
  replicas: 1                        # dev profile: single node, replication_factor 1
  selector:
    matchLabels:
      app.kubernetes.io/name: garage
  template:
    metadata:
      labels:
        app.kubernetes.io/name: garage
    spec:
      containers:
        - name: garage
          image: dxflrs/garage:v2.3.0   # pinned
          args: ["/garage", "-c", "/etc/garage/garage.toml", "server"]
          ports:
            - {name: s3, containerPort: 3900}
            - {name: rpc, containerPort: 3901}
            - {name: admin, containerPort: 3903}
          envFrom: []
          env:
            - name: GARAGE_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: garage-credentials, key: access-key}}
            - name: GARAGE_SECRET_KEY
              valueFrom: {secretKeyRef: {name: garage-credentials, key: secret-key}}
          volumeMounts:
            - {name: config, mountPath: /etc/garage}
            - {name: data, mountPath: /var/lib/garage}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
      volumes:
        - name: config
          configMap:
            name: garage-config
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 20Gi
