# The portal is the user-facing surface: accept cluster-internal ingress on
# the proxy (4180) and API (8899); reach the trust plane (OIDC/policy), the
# data plane (catalog/S3), compute (Trino), and the public internet on 443
# (contracted open-data sources — CBS StatLine).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-portal
  namespace: experience-plane
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - {protocol: TCP, port: 4180}
        - {protocol: TCP, port: 8899}
        - {protocol: TCP, port: 8815}
  egress:
    - to:
        - namespaceSelector:
            matchExpressions:
              - {key: carina.io/plane, operator: In, values: [data, trust, compute]}
    - to: []
      ports:
        - {protocol: TCP, port: 443}
