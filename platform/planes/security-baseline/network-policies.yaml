# Trino reads the catalog + object store; the router (experience) queries Trino.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-lanes
  namespace: compute-plane
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {carina.io/plane: experience}
      ports:
        - {protocol: TCP, port: 8080}
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {carina.io/plane: data}
      ports:
        - {protocol: TCP, port: 8181}
        - {protocol: TCP, port: 3900}

