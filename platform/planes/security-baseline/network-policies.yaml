# Default-deny per plane, then explicit allowances — a baseline to adapt,
# not a finished perimeter. Every allowance states its reason.
#
# Conventions: DNS egress is always allowed; traffic within a plane is
# allowed (the plane is the trust boundary at this stage); cross-plane
# flows are enumerated one by one.

# ---- data-plane -------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: data-plane
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: data-plane
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to: []
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-intra-plane
  namespace: data-plane
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {}
  egress:
    - to:
        - podSelector: {}
---
# Lakekeeper (8181) + Garage S3 (3900) serve the other planes.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-catalog-and-s3-consumers
  namespace: data-plane
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchExpressions:
              - {key: carina.io/plane, operator: In, values: [compute, experience, trust]}
      ports:
        - {protocol: TCP, port: 8181}
        - {protocol: TCP, port: 3900}

# ---- trust-plane ------------------------------------------------------------
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: trust-plane
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: trust-plane
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to: []
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-intra-plane
  namespace: trust-plane
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {}
  egress:
    - to:
        - podSelector: {}
---
# Every plane authenticates (Keycloak), asks policy questions (OPA), and
# checks relationships (OpenFGA).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-identity-consumers
  namespace: trust-plane
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchExpressions:
              - {key: carina.io/plane, operator: Exists}
      ports:
        - {protocol: TCP, port: 8080}   # Keycloak / OpenFGA
        - {protocol: TCP, port: 8181}   # OPA
---
# CNPG backups: keycloak-db / openfga-db archive WAL to Garage in data-plane.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-backup-to-s3
  namespace: trust-plane
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {carina.io/plane: data}
      ports:
        - {protocol: TCP, port: 3900}

