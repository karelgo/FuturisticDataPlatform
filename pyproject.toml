[project]
name = "carina-platform"
version = "0.6.0"
description = "CARINA reference implementation (laptop profile): contract-driven lakehouse, semantic layer, evidence plane, and portal UI"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "duckdb>=1.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "sqlglot>=27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyjwt>=2.8", "cryptography>=42"]
trino = ["trino>=0.330"]
iceberg = ["pyiceberg[sql-sqlite]>=0.11"]
auth = ["pyjwt>=2.8", "cryptography>=42"]

[project.scripts]
carina = "carina.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/carina"]
