apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "carina.fullname" . }}
  labels:
    {{- include "carina.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "carina.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "carina.selectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: carina
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8899
          env:
            - name: CARINA_ROOT
              value: /app
            {{- if .Values.trinoDsn }}
            - name: CARINA_TRINO_DSN
              value: {{ .Values.trinoDsn | quote }}
            {{- end }}
          readinessProbe:
            httpGet: {path: /api/lanes, port: http}
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: {path: /api/lanes, port: http}
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /app/data
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "carina.fullname" . }}-data
          {{- else }}
          emptyDir: {}
          {{- end }}
