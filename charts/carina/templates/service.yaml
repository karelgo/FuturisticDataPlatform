apiVersion: v1
kind: Service
metadata:
  name: {{ include "carina.fullname" . }}
  labels:
    {{- include "carina.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      name: http
  selector:
    {{- include "carina.selectorLabels" . | nindent 4 }}
