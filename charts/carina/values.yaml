image:
  repository: ghcr.io/karelgo/carina
  tag: "0.7.0"
  pullPolicy: IfNotPresent

replicaCount: 1

service:
  type: ClusterIP
  port: 8899

# Persist /app/data (the DuckDB lakehouse + bronze payloads) across restarts.
persistence:
  enabled: false
  size: 5Gi
  storageClassName: ""

# Attach the Trino lane by setting e.g. "trino.compute-plane:8080/iceberg/carina".
trinoDsn: ""

# Identity (ADR-0009). mode "none" is the open laptop profile; "oidc"
# requires a Bearer token on the data path, validated against the issuer.
auth:
  mode: none
  oidcIssuer: ""     # e.g. http://keycloak-http.trust-plane.svc/auth/realms/carina
  oidcAudience: carina-portal

resources:
  requests: {cpu: 250m, memory: 512Mi}
  limits: {cpu: "2", memory: 2Gi}

ingress:
  enabled: false
  className: ""
  host: carina.local
  tls: []

# OpenShift Route (use instead of ingress there; see values-openshift.yaml).
route:
  enabled: false
  host: ""   # empty = let OpenShift generate one

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

# Restricted PSS-compliant container hardening; the rootfs is read-only —
# only /app/data (the lakehouse volume) and /tmp are writable.
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

# Extra environment (e.g. CARINA_CATALOG_URI, CARINA_WAREHOUSE).
extraEnv: []

# Scheduled platform jobs. Both mount the same data volume as the server —
# with an RWO PVC they colocate on the server's node; use RWX or S3-backed
# CARINA_WAREHOUSE for multi-node.
jobs:
  # Rebuild bronze/silver/gold from the contracted sources.
  refresh:
    enabled: false
    schedule: "0 6 * * *"
  # Anchor the evidence chain into the warehouse (ADR-0010 durability).
  anchor:
    enabled: false
    schedule: "30 * * * *"
